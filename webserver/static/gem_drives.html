<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html lang="en">
    <head>
        <meta http-equiv="content-type" content="text/html; charset=utf-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
        <title>CosmosEx GEM drives</title>
        <link rel="stylesheet" type="text/css" href="css/bootstrap.light.css">
        <link rel="stylesheet" type="text/css" href="css/style.css">
		    <script type="text/javascript" src="js/modernizr.custom.50426.js"></script>
        <script type="text/javascript">
        //unfortunately we have to support IE<10, so decide on zepto/jquery here
    		document.write('<script type="text/javascript" src=js/jquery.js><\/script>');
    		</script>
        <script type="text/javascript">
    		  document.write('<script type="text/javascript" src=js/drives.js><\/script>');

          var dir = "/home";
          var selectedFile = "";

          var driveTypes = [];
          var paths = [];
          var selectingFileForIndex = -1;

          // initialize paths and driveTypes
          for(var i=0; i<16; i++) {
            paths.push("");
            driveTypes.push(0);
          }

          // Logout function
          function logout() {
            fetch('/auth/logout', {
              method: 'POST',
              credentials: 'include'
            })
            .then(function(response) {
              // Clear localStorage if token is stored there
              if (localStorage.getItem('auth_token')) {
                localStorage.removeItem('auth_token');
              }
              // Redirect to login page
              window.location.href = '/login.html';
            })
            .catch(function(error) {
              console.error('Logout error:', error);
              // Redirect to login page even on error
              window.location.href = '/login.html';
            });
          }

          // bind handlers to combo change and get IDs from backend
          window.onload = function() {
            $("[name=file-selector]").hide();

            var table = document.getElementById("device-ids-table");

            for(let i=2; i<16; i++) {
              const tr = table.insertRow();

              var letter = String.fromCharCode(65 + i);

              const td1 = tr.insertCell();
              td1.innerHTML = `<center>${letter}</center>`;

              const td2 = tr.insertCell();
              td2.innerHTML = `<center><select id="TRANS_DRIVE_${letter}" name="TRANS_DRIVE_${letter}"><option value="0">off</option><option value="1">GEM</option><option value="2">config</option></select></center>`;

              const td3 = tr.insertCell();
              td3.id = `PATH_${letter}`;
              td3.innerHTML = "";
            }

            bindHandlersGEMDrives();
            getDrivesConfig();
          }
        </script>
        <style>
          button {
            font-size: 16px;
          }
          #device-ids-table {
            border-collapse: collapse;
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
          }
          #device-ids-table th {
            background: #f8f8f8;
            color: #333;
            font-weight: bold;
            padding: 15px;
            text-align: left;
            border-bottom: 2px solid #e0e0e0;
          }
          #device-ids-table td {
            padding: 15px;
            border-bottom: 1px solid #e8e8e8;
            text-align: center;
          }
          #device-ids-table td:nth-child(3) {
            text-align: left;
          }
          #device-ids-table tr:last-child td {
            border-bottom: none;
          }
          #device-ids-table tr:hover {
            background-color: #fafafa;
          }
          #device-ids-table tr[bgcolor="#cccccc"] {
            background: #f8f8f8 !important;
          }
          #device-ids-table tr[bgcolor="#cccccc"] td {
            border-bottom: 2px solid #e0e0e0;
          }
          #device-ids-table tr.drive-type-off td {
            background-color: #e8e8e8;
          }
          #device-ids-table tr.drive-type-off:hover td {
            background-color: #e0e0e0;
          }
        </style>
        <style>
          body {
            margin: 0;
            padding: 20px 0;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            font-family: sans-serif;
          }
          body .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 1200px;
            margin: 20px auto;
            position: relative;
          }

          .container-file-selector {
            z-index: 1000;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
          }

          .file-selector {
            width: 400px;
            height: 500px;
            background: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
          }

          .top-bar {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid #ddd;
            background: #fafafa;
          }

          .path {
            flex-grow: 1;
            font-size: 14px;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .top-bar button {
            margin-left: 10px;
            padding: 6px 12px;
            cursor: pointer;
          }

          .item-list {
            flex-grow: 1;
            overflow-y: auto;
          }

          .item {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
          }

          .item:hover {
            background-color: #f9f9f9;
          }

          .bottom-bar {
            display: flex;
            justify-content: flex-end;
            padding: 10px 16px;
            border-top: 1px solid #ddd;
            background: #fafafa;
          }

          .bottom-bar button {
            margin-left: 10px;
            padding: 6px 12px;
            cursor: pointer;
          }
          #logout-button {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 8px 16px;
            font-size: 14px;
            background-color: #666;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: background-color 0.3s ease;
          }
          #logout-button:hover {
            background-color: #555;
          }
          .footer-links {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            font-size: 14px;
            color: #666;
          }
          .footer-links a {
            color: #0066cc;
            text-decoration: none;
            margin: 0 10px;
          }
          .footer-links a:hover {
            text-decoration: underline;
          }
          .footer-links span {
            color: #999;
            margin: 0 5px;
          }
        </style>
      </head>
    <body>
    <div class="container">
    <button id="logout-button" onclick="logout()">Logout</button>
        <div class="row">
            <div class="span12">
                <div id="breadcrumbs-container"></div>
                <script src="js/breadcrumbs.js"></script>
                <h2>CosmosEx</h2>
                <h3>GEM drives configuration</h3>
                <p>Configure the host paths which will be accessible via drives in GEM. You need exactly one drive set to CONFIG to be able to access files of the CE config drive.</p>
            </div>
        </div>

        <form id="combo-form">
          <center>
            <table id="device-ids-table">
              <tr bgcolor="#cccccc"><td><b>Drive</b></td><td><b>Drive type</b></td><td><b>path to host folder</b></td></tr>

              <!-- the rows of this table are generated via javascript -->

            </table>
            <p></p>
            <p><button type="button" onclick="onIdsSave();">Save</button> <span id="save-message" style="display: none; margin-left: 12px; color: #3baf16; font-weight: bold;"></span></p>
        </center>
      </form>

      <div class="footer-links">
        <a href="https://joo.kie.sk/?page_id=384" target="_blank">homepage</a><span>|</span><a href="https://joo.kie.sk/?page_id=415" target="_blank">manual</a><span>|</span><a href="credits.html">credits</a>
      </div>
    </div>

    <div class="container-file-selector">
      <div class="file-selector" name="file-selector">
        <div class="top-bar">
          <div class="path" id="currentPath">/home/user/folder</div>
          <button onclick="goUp()">Up</button>
        </div>

        <div class="item-list" id="itemList">
          <!-- List items will be loaded here -->
        </div>

        <div class="bottom-bar">
          <button onclick="onCancel()">Cancel</button>
          <button onclick="onOK()">OK</button>
        </div>
      </div>
    </div>

    </body>
</html>
