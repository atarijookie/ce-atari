<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html lang="en">
    <head>
        <meta http-equiv="content-type" content="text/html; charset=utf-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
        <title>CosmosEx Start Page</title>
        <!--
        <link rel="stylesheet" type="text/css" href="css/bootstrap.light.css">
        <link rel="stylesheet" type="text/css" href="css/style.css">
		    <script type="text/javascript" src="js/modernizr.custom.50426.js"></script>
        -->
        <script>
        document.write('<link rel="stylesheet" type="text/css" href="css/combined.css">');
		</script>
        <style>
            body {
                background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
                min-height: 100vh;
                margin: 0;
                padding: 20px 0;
            }
            .container {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                max-width: 1200px;
                margin: 0 auto;
                background: white;
                border-radius: 12px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.1);
                padding: 30px;
                margin-top: 20px;
                margin-bottom: 20px;
                position: relative;
            }
            .row {
                width: 100%;
                display: flex;
                justify-content: center;
            }
            .span12 {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            #breadcrumbs-container {
                width: 100%;
            }
            h2, h4 {
                text-align: center;
            }
            #devices-container {
                margin: 0 auto;
            }
            .footer-links {
                margin-top: 40px;
                padding-top: 20px;
                border-top: 1px solid #e0e0e0;
                text-align: center;
                font-size: 14px;
                color: #666;
            }
            .footer-links a {
                color: #0066cc;
                text-decoration: none;
                margin: 0 10px;
            }
            .footer-links a:hover {
                text-decoration: underline;
            }
            .footer-links span {
                color: #999;
                margin: 0 5px;
            }
            #logout-button {
                position: absolute;
                top: 15px;
                right: 15px;
                padding: 8px 16px;
                font-size: 14px;
                background-color: #666;
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                z-index: 1000;
                box-shadow: 0 2px 6px rgba(0,0,0,0.2);
                transition: background-color 0.3s ease;
            }
            #logout-button:hover {
                background-color: #555;
            }
            button.device-button,
            button.device-action-button {
                background-color: #3baf16 !important;
                background: #3baf16 !important;
                box-shadow: none !important;
                -webkit-box-shadow: none !important;
                -moz-box-shadow: none !important;
                border: none !important;
                opacity: 1 !important;
                filter: none !important;
            }
            button.device-button:not([style*="opacity: 0.7"]),
            button.device-action-button:not([style*="opacity: 0.7"]) {
                opacity: 1 !important;
            }
        </style>
    </head>
    <body>
    <div class="container">
    <button id="logout-button" onclick="logout()">Logout</button>
        <div class="row">
            <div class="span12">
                <div id="breadcrumbs-container"></div>
                <script src="js/breadcrumbs.js"></script>
                <h2>CosmosEx</h2>
            </div>
        </div>

        <br>
        <h4>Devices</h4>
        <div id="devices-container" style="display: flex; flex-direction: column; gap: 15px; max-width: 300px;">
            <p>Loading devices...</p>
        </div>

        <div class="footer-links">
            <a href="https://joo.kie.sk/?page_id=384" target="_blank">homepage</a><span>|</span><a href="https://joo.kie.sk/?page_id=415" target="_blank">manual</a><span>|</span><a href="credits.html">credits</a>
        </div>
    </div>

    <script>
    // Fetch and display devices
    function loadDevices() {
        fetch('/devices', {
            method: 'GET',
            credentials: 'include'
        })
        .then(function(response) {
            if (!response.ok) {
                throw new Error('Failed to load devices');
            }
            return response.json();
        })
        .then(function(devices) {
            var container = document.getElementById('devices-container');

            if (devices.length === 0) {
                container.innerHTML = '<p>No devices found.</p>';
                return;
            }

            // Clear loading message
            container.innerHTML = '';

            // Create buttons for each device
            devices.forEach(function(device) {
                var button = document.createElement('button');
                button.className = 'device-button device-action-button';
                // Set base styles
                button.style.padding = '15px 25px';
                button.style.cursor = 'pointer';
                button.style.color = 'white';
                button.style.border = 'none';
                button.style.borderRadius = '4px';
                button.style.textAlign = 'center';
                button.style.width = '100%';
                button.style.display = 'flex';
                button.style.flexDirection = 'column';
                button.style.alignItems = 'center';
                button.style.justifyContent = 'center';
                button.style.fontSize = '16px';
                // Set background color with !important to override any CSS - use same color as device.html
                button.style.setProperty('background-color', '#3baf16', 'important');
                button.style.setProperty('background', '#3baf16', 'important');
                button.style.setProperty('box-shadow', 'none', 'important');
                button.style.setProperty('-webkit-box-shadow', 'none', 'important');
                button.style.setProperty('-moz-box-shadow', 'none', 'important');
                button.style.setProperty('filter', 'none', 'important');
                button.title = 'MAC: ' + device.mac + (device.connected ? ' (Connected)' : ' (Not Connected)');

                // Create name text (larger)
                var nameText = document.createElement('span');
                nameText.textContent = device.name || device.mac;
                nameText.style.cssText = 'font-size: 16px; font-weight: bold; display: block;';
                
                // Create MAC text (smaller, second line)
                var macText = document.createElement('span');
                macText.textContent = device.mac;
                macText.style.cssText = 'font-size: 12px; opacity: 0.9; display: block; margin-top: 4px;';

                // Add name and MAC to button
                button.appendChild(nameText);
                button.appendChild(macText);

                // Add click handler - navigate to device page with MAC and name parameters
                button.onclick = function() {
                    // Remove colons from MAC for URL
                    var macNoColons = device.mac.replace(/:/g, '');
                    var url = '/device.html?mac=' + encodeURIComponent(macNoColons);
                    if (device.name) {
                        url += '&name=' + encodeURIComponent(device.name);
                    }
                    window.location.href = url;
                };

                // Style based on connection status (always green; optional visual hint via opacity)
                if (!device.connected) {
                    button.style.opacity = '0.7';
                } else {
                    button.style.setProperty('opacity', '1', 'important');
                }

                container.appendChild(button);
            });
        })
        .catch(function(error) {
            console.error('Error loading devices:', error);
            document.getElementById('devices-container').innerHTML = '<p style="color: red;">Error loading devices. Please refresh the page.</p>';
        });
    }

    // Load devices when page loads
    document.addEventListener('DOMContentLoaded', loadDevices);

    // Logout function
    function logout() {
        fetch('/auth/logout', {
            method: 'POST',
            credentials: 'include'
        })
        .then(function(response) {
            // Clear localStorage if token is stored there
            if (localStorage.getItem('auth_token')) {
                localStorage.removeItem('auth_token');
            }
            // Redirect to login page
            window.location.href = '/login.html';
        })
        .catch(function(error) {
            console.error('Logout error:', error);
            // Redirect to login page even on error
            window.location.href = '/login.html';
        });
    }
    </script>
    </body>
</html>
