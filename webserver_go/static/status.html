<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html lang="en">
    <head>
        <meta http-equiv="content-type" content="text/html; charset=utf-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
        <title>CosmosEx download page</title>
        <link rel="stylesheet" type="text/css" href="css/bootstrap.light.css">
        <script type="text/javascript" src="js/modernizr.custom.50426.js"></script>
        <script type="text/javascript" src="js/jquery.js"> </script>
        <link rel="stylesheet" type="text/css" href="css/style.css">

        <style>
            pre {outline: 1px solid #ccc; padding: 5px; margin: 5px; }
            .string { color: green; }
            .number { color: darkorange; }
            .boolean { color: blue; }
            .null { color: magenta; }
            .key { color: red; }
        </style>

    <script type="text/javascript">
        function getURLParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        function getStatus() {
            var mac = getURLParameter('mac');
            if (!mac) {
                document.getElementById('pre_status').textContent = 'Error: No MAC address specified.';
                return;
            }
            $.ajax({
                url: '/status/' + encodeURIComponent(mac),
                type: 'GET',
                dataType: 'text',
                success: function(data){
                    var pre_status = document.getElementById('pre_status');
                    pre_status.textContent = data;
                    var d = new Date();
                    var stamp = [
                        String(d.getDate()).padStart(2, '0'),
                        String(d.getMonth() + 1).padStart(2, '0'),
                        d.getFullYear()
                    ].join('.') + ' ' + [
                        String(d.getHours()).padStart(2, '0'),
                        String(d.getMinutes()).padStart(2, '0'),
                        String(d.getSeconds()).padStart(2, '0')
                    ].join(':');
                    document.getElementById('status-timestamp').textContent = 'Status retrieved at: ' + stamp;
                },
                error: function (xhr, textStatus, errorThrown) {
                    var pre_status = document.getElementById('pre_status');
                    pre_status.textContent = 'Error fetching status: ' + xhr.statusText;
                    var d = new Date();
                    var stamp = [
                        String(d.getDate()).padStart(2, '0'),
                        String(d.getMonth() + 1).padStart(2, '0'),
                        d.getFullYear()
                    ].join('.') + ' ' + [
                        String(d.getHours()).padStart(2, '0'),
                        String(d.getMinutes()).padStart(2, '0'),
                        String(d.getSeconds()).padStart(2, '0')
                    ].join(':');
                    document.getElementById('status-timestamp').textContent = 'Status retrieved at: ' + stamp;
                }
            })
        }

        $(document).ready(function(){
            getStatus();                    // get first status now
            setInterval(getStatus, 10000);  // refresh status every 10 seconds
        });
        </script>
  </head>
  <body>
    <div class="container">
        <div class="row">
            <div class="span12">
                <div id="breadcrumbs-container"></div>
                <script src="js/breadcrumbs.js"></script>
                <h2>CosmosEx - Status</h2>
                <pre name="pre_status" id="pre_status"></pre>
                <div id="status-timestamp" style="margin-top: 8px; font-style: italic;"></div>
            </div>
         </div>
     </div>
  </body>
</html>
