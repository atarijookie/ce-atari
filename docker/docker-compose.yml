# Run from the repository root:
#   docker compose -f docker/docker-compose.yml up --build
#
# Settings persist on the host (default: /opt/ce/settings, same as .env).
# Override with CE_SETTINGS_HOST=/some/host/path
#
# Host filesystem is visible inside the container at /mnt/hostdrive
# (read-write, so translated/GEM drives can write back). Point GEM paths
# at /mnt/hostdrive/... in the web UI.
#
# network_mode: host is required for discovery: devices UDP-broadcast to
# port 7200 and the server unicasts the reply to the device on port 7201.
# Docker bridge NAT (-p 7200:7200/udp) does not deliver LAN broadcasts.
# Host networking also puts 8080 and 7300-7302 directly on the host.
# Linux Docker only; `ports:` cannot be used with host mode.
#
# USB mice/keyboards/gamepads: IKBD scans /dev/input/by-path and opens
# /dev/input/event* and /dev/input/js*. Allow char major 13 (Linux input).
#
# USB raw disks for HDD emulation: PATH_RAW_x holds a host device path like
# /dev/sda, so the host /dev is bind-mounted to /dev (hotplugged disks and
# /dev/disk/by-label appear live). Allow block major 8 (sd* - SCSI/SATA/USB
# disks). WARNING: this also gives the container access to any SATA/USB
# system disk on the host (e.g. /dev/sda on a PC); a Pi booting from SD card
# (mmcblk*, major 179) is not exposed.

services:
  ce:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ce-atari
    network_mode: host
    device_cgroup_rules:
      # Linux input subsystem: js*, mouse*, event* (needed for USB hotplug)
      - "c 13:* rwm"
      # SCSI/SATA/USB disks: sd* (raw disk access for HDD emulation)
      - "b 8:* rwm"
    volumes:
      # Persistent settings (writable). Host path matches SETTINGS_DIR in .env.
      - type: bind
        source: ${CE_SETTINGS_HOST:-/opt/ce/settings}
        target: /opt/ce/settings
        bind:
          create_host_path: true
      # Entire host filesystem for HDD / GEM drive emulation
      - type: bind
        source: /
        target: /mnt/hostdrive
        bind:
          propagation: rslave
      # Host /dev: USB / HID discovery (/dev/input) and raw USB disks (/dev/sd*).
      # Docker still mounts its own /dev/shm, /dev/pts, /dev/mqueue on top.
      - type: bind
        source: /dev
        target: /dev
    restart: unless-stopped
